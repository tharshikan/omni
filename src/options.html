<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Leap — Settings</title>
		<style>
			:root {
				--bg: #f5f5f7;
				--card: #ffffff;
				--text: rgba(0, 0, 0, 0.9);
				--text-2: rgba(0, 0, 0, 0.55);
				--hairline: rgba(0, 0, 0, 0.09);
				--accent: #007aff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1c1c1e;
					--card: #2a2a2d;
					--text: rgba(255, 255, 255, 0.92);
					--text-2: rgba(255, 255, 255, 0.55);
					--hairline: rgba(255, 255, 255, 0.1);
					--accent: #0a84ff;
				}
			}
			* { margin: 0; padding: 0; box-sizing: border-box; }
			body {
				background: var(--bg);
				color: var(--text);
				font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
				-webkit-font-smoothing: antialiased;
				padding: 48px 24px;
			}
			.wrap { max-width: 860px; margin: 0 auto; }
			header { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
			header img { width: 40px; height: 40px; border-radius: 10px; }
			h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
			.subtitle { color: var(--text-2); font-size: 14px; margin: 6px 0 32px; }
			h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
				gap: 14px;
			}
			.card {
				background: var(--card);
				border: 1px solid var(--hairline);
				border-radius: 14px;
				padding: 10px;
				cursor: pointer;
				transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
			}
			.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }
			.card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
			.preview {
				border-radius: 10px;
				height: 96px;
				padding: 10px 12px;
				display: flex;
				flex-direction: column;
				gap: 7px;
				border: 1px solid rgba(127, 127, 127, 0.2);
				overflow: hidden;
				position: relative;
			}
			.bar { height: 8px; border-radius: 4px; width: 70%; }
			.bar.b2 { width: 52%; }
			.bar.b3 { width: 60%; }
			.chiprow { display: flex; gap: 6px; margin-top: auto; }
			.chip { height: 14px; border-radius: 7px; flex: none; }
			.chip.accent { width: 42px; }
			.chip.match { width: 26px; }
			.cardname { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px 2px; font-size: 13px; font-weight: 600; }
			.tick { color: var(--accent); font-size: 13px; visibility: hidden; }
			.card.selected .tick { visibility: visible; }
			.auto-split { position: absolute; inset: 0; }
			.auto-split .half { position: absolute; top: 0; bottom: 0; width: 50%; }
			footer { margin-top: 36px; color: var(--text-2); font-size: 12px; }
		</style>
	</head>
	<body>
		<div class="wrap">
			<header>
				<img src="assets/logo-128.png" alt="Leap">
				<h1>Leap</h1>
			</header>
			<p class="subtitle">Changes apply instantly, everywhere Leap is open.</p>
			<h2>Theme</h2>
			<div class="grid" id="theme-grid"></div>
			<footer>Themes color the command palette, the recents switcher, and the explorer drawer. “Auto” follows your system’s light and dark appearance.</footer>
		</div>
		<script src="themes.js"></script>
		<script src="options.js"></script>
	</body>
</html>
